<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Zeroed · Bienvenida beta cerrada</title>
<style>
  :root { --ink: #0a0806; --bone: #ece3cf; --bone-dim: #b9ae99; --ash: #857a68; --blood: #c4161c; --blood-hi: #ff2a2a; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; background: #050403; color: var(--bone); font: 15px/1.5 system-ui, sans-serif;
    display: flex; flex-direction: column; align-items: center; gap: 18px; padding: 24px 16px; }
  canvas { width: min(92vw, 720px); aspect-ratio: 1; height: auto; display: block; box-shadow: 0 30px 80px #000; }
  .bar { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; align-items: center; }
  button { font: 600 14px system-ui, sans-serif; letter-spacing: .06em; color: var(--bone); background: var(--blood); border: 0; padding: 10px 18px; cursor: pointer; }
  button.ghost { background: transparent; border: 1px solid #ece3cf44; }
  button:disabled { opacity: .5; cursor: progress; }
  #status { color: var(--ash); min-height: 1.5em; }
</style>
</head>
<body>
  <canvas id="stage" width="1080" height="1080"></canvas>
  <div class="bar">
    <button id="video">Descargar vídeo (1080×1080)</button>
    <button id="gif" class="ghost">Descargar GIF (540×540)</button>
    <button id="png" class="ghost">Descargar PNG (fotograma final)</button>
  </div>
  <p id="status"></p>

<script type="module">
const W = 1080, H = 1080, LOOP = 6.5, PAD = 84;
const C = { ink: '#0a0806', bone: '#ece3cf', boneDim: '#b9ae99', ash: '#857a68', blood: '#c4161c', bloodHi: '#ff2a2a', bloodDeep: '#6e0a0d', ember: '#ff7a2f' };
const FONT_DIR = '../../node_modules/@fontsource';
const fonts = [
  ['Anton', `${FONT_DIR}/anton/files/anton-latin-400-normal.woff2`, '400'],
  ['Special Elite', `${FONT_DIR}/special-elite/files/special-elite-latin-400-normal.woff2`, '400'],
  ['Barlow', `${FONT_DIR}/barlow/files/barlow-latin-500-normal.woff2`, '500'],
  ['Barlow', `${FONT_DIR}/barlow/files/barlow-latin-700-normal.woff2`, '700'],
];
await Promise.all(fonts.map(async ([family, url, weight]) => {
  const face = new FontFace(family, `url(${url})`, { weight });
  document.fonts.add(await face.load());
}));

// ── helpers ──
const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const prog = (t, a, b) => clamp((t - a) / (b - a));
const easeOut = (x) => 1 - Math.pow(1 - x, 3);
const easeBack = (x) => { const c = 1.9; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
const rnd = (n) => { const x = Math.sin(n * 12.9898 + 78.233) * 43758.5453; return x - Math.floor(x); };

// Pre-rendered grain tiles (cycled per frame).
const grain = Array.from({ length: 4 }, (_, k) => {
  const c = document.createElement('canvas'); c.width = c.height = 360;
  const g = c.getContext('2d'), img = g.createImageData(360, 360);
  for (let i = 0; i < img.data.length; i += 4) { const v = rnd(i * 0.37 + k * 999) * 255; img.data[i] = img.data[i + 1] = img.data[i + 2] = v; img.data[i + 3] = 255; }
  g.putImageData(img, 0, 0); return c;
});

const embers = Array.from({ length: 46 }, (_, i) => ({
  x: rnd(i + 1) * W, y0: rnd(i + 50) * H, speed: 1 + Math.round(rnd(i + 90) * 2), // whole loops → seamless
  r: 1.2 + rnd(i + 130) * 2.6, sway: 10 + rnd(i + 170) * 26, phase: rnd(i + 210) * 6.28,
}));

function glitchText(ctx, text, x, y, amount, seed, color = C.bone) {
  if (amount > 0.01) {
    ctx.globalAlpha *= 0.75;
    ctx.fillStyle = '#ff2a2a'; ctx.fillText(text, x - 4 - amount * 14 * rnd(seed), y);
    ctx.fillStyle = '#4ff0ff'; ctx.fillText(text, x + 4 + amount * 14 * rnd(seed + 1), y);
    ctx.globalAlpha /= 0.75;
  }
  ctx.fillStyle = color; ctx.fillText(text, x, y);
}

function drawStroke(ctx, pts, p, color, width) {
  if (p <= 0) return;
  // draw a polyline progressively by its length fraction
  let total = 0; const seg = [];
  for (let i = 1; i < pts.length; i++) { const d = Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]); seg.push(d); total += d; }
  let left = total * p;
  ctx.beginPath(); ctx.moveTo(...pts[0]);
  for (let i = 1; i < pts.length && left > 0; i++) {
    const f = Math.min(1, left / seg[i - 1]);
    ctx.lineTo(pts[i - 1][0] + (pts[i][0] - pts[i - 1][0]) * f, pts[i - 1][1] + (pts[i][1] - pts[i - 1][1]) * f);
    left -= seg[i - 1];
  }
  ctx.strokeStyle = color; ctx.lineWidth = width; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.stroke();
}

function render(ctx, t) {
  const f = Math.max(0, Math.floor(t * 30));
  const stampT = 3.0;
  const shake = t > stampT && t < stampT + 0.35 ? (1 - prog(t, stampT, stampT + 0.35)) * 14 : 0;

  ctx.save();
  ctx.fillStyle = C.ink; ctx.fillRect(0, 0, W, H);
  ctx.translate((rnd(f) - 0.5) * shake, (rnd(f + 7) - 0.5) * shake);

  // background glow (breathing)
  const breathe = 0.85 + 0.15 * Math.sin(t / LOOP * Math.PI * 2);
  let g = ctx.createRadialGradient(780, 380, 0, 780, 380, 620);
  g.addColorStop(0, `rgba(110,10,13,${0.6 * breathe})`); g.addColorStop(1, 'rgba(110,10,13,0)');
  ctx.fillStyle = g; ctx.fillRect(-40, -40, W + 80, H + 80);
  g = ctx.createRadialGradient(540, 1250, 0, 540, 1250, 760);
  g.addColorStop(0, 'rgba(255,90,31,0.22)'); g.addColorStop(1, 'rgba(255,90,31,0)');
  ctx.fillStyle = g; ctx.fillRect(-40, -40, W + 80, H + 80);

  // embers
  for (const e of embers) {
    const y = ((e.y0 - (t / LOOP) * e.speed * H) % H + H) % H;
    const x = e.x + Math.sin(t * 1.3 + e.phase) * e.sway;
    const a = 0.35 + 0.65 * (y / H);
    ctx.fillStyle = `rgba(255,${120 + Math.round(60 * rnd(e.phase))},47,${a})`;
    ctx.shadowColor = C.ember; ctx.shadowBlur = 10;
    ctx.beginPath(); ctx.arc(x, y, e.r, 0, Math.PI * 2); ctx.fill();
  }
  ctx.shadowBlur = 0;

  // ── header ──
  const hdr = easeOut(prog(t, 0.1, 0.7));
  ctx.globalAlpha = hdr;
  ctx.font = '64px Anton'; ctx.textBaseline = 'alphabetic';
  const wmGlitch = t < 0.9 ? 1 - prog(t, 0.1, 0.9) : (t > 4.4 && t < 4.6 ? 0.8 : 0.15);
  glitchText(ctx, 'ZEROED', PAD, PAD + 58, wmGlitch, f);

  ctx.font = '22px "Special Elite"'; ctx.letterSpacing = '4px';
  const chip = 'BETA CERRADA', cw = ctx.measureText(chip).width + 66;
  const cx = W - PAD - cw;
  ctx.strokeStyle = 'rgba(236,227,207,0.25)'; ctx.lineWidth = 1.5; ctx.strokeRect(cx, PAD + 4, cw, 58);
  ctx.fillStyle = C.boneDim; ctx.fillText(chip, cx + 48, PAD + 41);
  const blink = Math.floor(t * 2) % 2 === 0;
  ctx.fillStyle = blink ? C.bloodHi : C.bloodDeep; ctx.shadowColor = C.bloodHi; ctx.shadowBlur = blink ? 16 : 0;
  ctx.beginPath(); ctx.arc(cx + 26, PAD + 33, 6, 0, Math.PI * 2); ctx.fill(); ctx.shadowBlur = 0;
  ctx.letterSpacing = '0px'; ctx.globalAlpha = 1;

  // ── eyebrow (typewriter) ──
  const eyebrow = 'EXPEDIENTE 115 · SOLICITUD APROBADA';
  const chars = Math.floor(prog(t, 0.5, 1.6) * eyebrow.length);
  if (t > 0.45) {
    ctx.fillStyle = C.bloodHi; ctx.fillRect(PAD, 318, 14, 26);
    ctx.font = '26px "Special Elite"'; ctx.letterSpacing = '3.5px'; ctx.fillStyle = C.boneDim;
    const typed = eyebrow.slice(0, chars);
    ctx.fillText(typed, PAD + 32, 341);
    if (chars < eyebrow.length || Math.floor(t * 3) % 2) { const w = ctx.measureText(typed).width; ctx.fillStyle = C.bloodHi; ctx.fillRect(PAD + 36 + w, 318, 12, 26); }
    ctx.letterSpacing = '0px';
  }

  // ── headline ──
  ctx.font = '220px Anton';
  const l1 = easeOut(prog(t, 1.2, 1.7)), l2 = easeOut(prog(t, 1.5, 2.0));
  const flick = (n) => (rnd(f * 3 + n) > 0.93 ? 0.35 : 1);
  ctx.globalAlpha = l1 * (t < 2.2 ? flick(1) : 1);
  glitchText(ctx, 'ESTÁS', PAD, 590 + (1 - l1) * 40, (1 - l1) * 0.9, f + 3);
  ctx.globalAlpha = l2 * (t < 2.4 ? flick(2) : 1);
  const y2 = 800 + (1 - l2) * 40;
  ctx.shadowColor = 'rgba(196,22,28,0.55)'; ctx.shadowBlur = 50;
  glitchText(ctx, 'DENTRO.', PAD, y2, (1 - l2) * 0.9, f + 5, C.blood);
  ctx.shadowBlur = 0;
  // drips
  const dw = ctx.measureText('DENTRO.').width;
  [[0.1, 46, 2.0], [0.42, 84, 2.15], [0.74, 30, 2.3], [0.9, 58, 2.45]].forEach(([px, len, start], i) => {
    const p = easeOut(prog(t, start, start + 1.4));
    if (p <= 0) return;
    const x = PAD + dw * px, top = y2 - 12, h = len * p;
    const dg = ctx.createLinearGradient(0, top, 0, top + h); dg.addColorStop(0, C.blood); dg.addColorStop(1, '#a50f14');
    ctx.fillStyle = dg; ctx.beginPath(); ctx.roundRect(x - 9, top, 18, h, [0, 0, 9, 9]); ctx.fill();
    ctx.beginPath(); ctx.ellipse(x, top + h + 2, 12, 14 * p, 0, 0, Math.PI * 2); ctx.fillStyle = '#a50f14'; ctx.fill();
  });
  ctx.globalAlpha = 1;

  // ── tally marks: ronda 1 ──
  ctx.save(); ctx.translate(735, 400); ctx.rotate(-0.1);
  ctx.shadowColor = '#000a'; ctx.shadowBlur = 8;
  for (let i = 0; i < 4; i++) {
    const s = 1.8 + i * 0.18;
    drawStroke(ctx, [[i * 52, 0], [i * 52 - 4, 70], [i * 52 + 3, 160]], easeOut(prog(t, s, s + 0.22)), C.bone, 9);
  }
  drawStroke(ctx, [[-30, 120], [80, 70], [190, 30]], easeOut(prog(t, 2.6, 2.85)), C.bloodHi, 10);
  ctx.restore();

  // ── intro ──
  const intro = easeOut(prog(t, 2.2, 2.9));
  ctx.globalAlpha = intro; ctx.font = '500 36px Barlow'; ctx.fillStyle = C.boneDim;
  ctx.fillText('Te damos la bienvenida a la beta cerrada.', PAD, 920 + (1 - intro) * 16);
  ctx.fillText('Burned Mansion ', PAD, 968 + (1 - intro) * 16);
  const bm = ctx.measureText('Burned Mansion ').width;
  ctx.fillText('ya te espera.', PAD + bm, 968 + (1 - intro) * 16);
  ctx.font = '700 36px Barlow'; ctx.fillStyle = C.bone; ctx.fillText('Burned Mansion', PAD, 968 + (1 - intro) * 16);
  ctx.globalAlpha = 1;

  // ── stamp ──
  if (t > stampT - 0.15) {
    const p = prog(t, stampT - 0.15, stampT);
    const sc = 1 + (1 - easeOut(p)) * 0.9;
    ctx.save(); ctx.translate(900, 968); ctx.rotate(-0.14); ctx.scale(sc, sc);
    ctx.globalAlpha = 0.85 * easeOut(p);
    ctx.strokeStyle = C.bloodHi; ctx.fillStyle = C.bloodHi; ctx.lineWidth = 6;
    ctx.strokeRect(-150, -58, 300, 116); ctx.lineWidth = 2; ctx.strokeRect(-140, -48, 280, 96);
    ctx.textAlign = 'center'; ctx.font = '50px Anton'; ctx.letterSpacing = '4px'; ctx.fillText('ACCESO', 0, 10);
    ctx.font = '22px "Special Elite"'; ctx.letterSpacing = '5px'; ctx.fillStyle = C.bone; ctx.fillText('CONCEDIDO', 0, 38);
    ctx.letterSpacing = '0px'; ctx.textAlign = 'left';
    // worn ink: punch random holes
    ctx.globalCompositeOperation = 'destination-out'; ctx.globalAlpha = 1;
    for (let i = 0; i < 40; i++) { ctx.beginPath(); ctx.arc(-155 + rnd(i) * 310, -62 + rnd(i + 300) * 124, 1 + rnd(i + 600) * 3.5, 0, Math.PI * 2); ctx.fill(); }
    ctx.restore();
    // impact flash
    if (t < stampT + 0.12) { ctx.fillStyle = `rgba(255,42,42,${0.18 * (1 - prog(t, stampT, stampT + 0.12))})`; ctx.fillRect(-40, -40, W + 80, H + 80); }
  }

  ctx.restore(); // end shake

  // ── post FX: scanlines, grain, vignette, fade loop ──
  ctx.fillStyle = 'rgba(0,0,0,0.22)';
  for (let y = 0; y < H; y += 4) ctx.fillRect(0, y + 3, W, 1);
  ctx.globalAlpha = 0.07; ctx.globalCompositeOperation = 'overlay';
  const gt = grain[f % grain.length], ox = rnd(f) * 360, oy = rnd(f + 1) * 360;
  for (let x = -ox; x < W; x += 360) for (let y = -oy; y < H; y += 360) ctx.drawImage(gt, x, y);
  ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1;
  const vf = rnd(Math.floor(t * 8)) > 0.9 ? 0.82 : 0.7;
  g = ctx.createRadialGradient(W / 2, H * 0.45, W * 0.38, W / 2, H * 0.45, W * 0.85);
  g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, `rgba(0,0,0,${vf})`);
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  const fade = Math.max(1 - prog(t, 0, 0.25), prog(t, LOOP - 0.5, LOOP));
  if (fade > 0) { ctx.fillStyle = `rgba(10,8,6,${fade})`; ctx.fillRect(0, 0, W, H); }
}

// ── live preview ──
const stage = document.getElementById('stage'), sctx = stage.getContext('2d');
let t0 = performance.now(), frozen = null;
(function tick(now) {
  const t = frozen ?? (Math.max(0, now - t0) / 1000) % LOOP;
  render(sctx, t);
  requestAnimationFrame(tick);
})(t0);

// ── exports ──
const status = document.getElementById('status');
const buttons = [...document.querySelectorAll('button')];
const busy = (on, msg = '') => { buttons.forEach((b) => (b.disabled = on)); status.textContent = msg; };
const save = (blob, name) => { const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 4000); };

document.getElementById('video').onclick = async () => {
  const type = ['video/mp4;codecs=avc1', 'video/mp4', 'video/webm;codecs=vp9', 'video/webm'].find((m) => MediaRecorder.isTypeSupported(m));
  busy(true, `Grabando ${LOOP * 2} s en tiempo real…`);
  const rec = new MediaRecorder(stage.captureStream(30), { mimeType: type, videoBitsPerSecond: 12_000_000 });
  const chunks = []; rec.ondataavailable = (e) => chunks.push(e.data);
  const done = new Promise((r) => (rec.onstop = r));
  t0 = performance.now(); rec.start();
  setTimeout(() => rec.stop(), LOOP * 2 * 1000);
  await done;
  save(new Blob(chunks, { type }), `zeroed-bienvenida-beta.${type.startsWith('video/mp4') ? 'mp4' : 'webm'}`);
  busy(false, 'Vídeo descargado.');
};

document.getElementById('gif').onclick = async () => {
  busy(true, 'Generando GIF…');
  const { GIFEncoder, quantize, applyPalette } = await import('https://cdn.jsdelivr.net/npm/gifenc@1.0.3/+esm');
  const S = 540, FPS = 20, c = document.createElement('canvas'); c.width = c.height = S;
  const g = c.getContext('2d', { willReadFrequently: true }), enc = GIFEncoder();
  const frames = Math.round(LOOP * FPS);
  for (let i = 0; i < frames; i++) {
    g.setTransform(S / W, 0, 0, S / H, 0, 0); render(g, i / FPS);
    const { data } = g.getImageData(0, 0, S, S);
    const palette = quantize(data, 256); enc.writeFrame(applyPalette(data, palette), S, S, { palette, delay: 1000 / FPS });
    if (i % 10 === 0) { status.textContent = `Generando GIF… ${Math.round((i / frames) * 100)} %`; await new Promise(requestAnimationFrame); }
  }
  enc.finish(); save(new Blob([enc.bytes()], { type: 'image/gif' }), 'zeroed-bienvenida-beta.gif');
  busy(false, 'GIF descargado.');
};

document.getElementById('png').onclick = () => {
  frozen = LOOP - 0.8; render(sctx, frozen);
  stage.toBlob((b) => { save(b, 'zeroed-bienvenida-beta.png'); frozen = null; });
};
</script>
</body>
</html>
